name: Build Unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build IPA
        run: |
          cd ios
          xcodebuild \
            -workspace LxMusicMobile.xcworkspace \
            -scheme LxMusicMobile \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            CODE_SIGNING_ENTITLEMENTS= \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Package IPA
        run: |
          cd ios/build/Build/Products/Release-iphoneos
          mkdir -p Payload
          cp -R LxMusicMobile.app Payload/
          zip -r ../../../../../LxMusicMobile.ipa Payload
          cd ../../../../../
          ls -lh LxMusicMobile.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LxMusicMobile-unsigned
          path: LxMusicMobile.ipa
